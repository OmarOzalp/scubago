# Hosts the web build of ScubaGo on Netlify (free), so the app can be added to a
# phone's home screen without an App Store build. See docs/ios-distribution.md.
#
# Set EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY under
# Site configuration → Environment variables. They are compiled into the page,
# so only ever the publishable key: never the secret or service-role key.
# `npm run build:web` refuses to build without them, or with a secret key.

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every species and curated site has its own pre-rendered page (generateStaticParams in
# src/app/species/[id].tsx and src/app/site/[id].tsx), which Netlify serves first. These rewrites are
# the fallback for ids the build can't know: sites divers add, sightings and dives. Each such route
# is exported once, as a page named after its parameter.
[[redirects]]
  from = "/species/*"
  to = "/species/[id].html"
  status = 200

[[redirects]]
  from = "/site/*"
  to = "/site/[id].html"
  status = 200

[[redirects]]
  from = "/sighting/*"
  to = "/sighting/[id].html"
  status = 200

# /dive/edit, /dive/sign and /dive/count are pages of their own, matched before any page id.
[[redirects]]
  from = "/dive/edit"
  to = "/dive/edit.html"
  status = 200

[[redirects]]
  from = "/dive/sign"
  to = "/dive/sign.html"
  status = 200

[[redirects]]
  from = "/dive/count"
  to = "/dive/count.html"
  status = 200

[[redirects]]
  from = "/dive/*"
  to = "/dive/[id].html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404

# Script bundles are content-hashed, so they never change under the same name.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
